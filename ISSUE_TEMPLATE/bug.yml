name: Bug
description: Something is broken
labels: ["bug"]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Where
      options: [Local, Demo (Render)]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots / logs
