name: Feature / task
description: Something new to build or change
labels: ["feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: "As a <user>, I want <thing>, so that <benefit>."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements. If you can't write these, the task isn't ready to start.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / out of scope
